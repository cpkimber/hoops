<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoops</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--mut:#6b675e;--card:#fff;--ac:#e8661c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f1efe9;--mut:#9a968c;--card:#232328;--ac:#ff7b36}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f1efe9;--mut:#9a968c;--card:#232328;--ac:#ff7b36}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;min-height:100vh}
.stats{display:flex;gap:10px;width:100%;max-width:800px}
.stat{flex:1;background:var(--card);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
canvas{width:100%;max-width:800px;border-radius:12px;touch-action:none;display:block;background:#222}
button{font:600 18px system-ui,sans-serif;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 28px;width:100%;max-width:800px;cursor:pointer}
button:active{transform:scale(.98)}
p{margin:0;color:var(--mut);font-size:14px;text-align:center;max-width:800px}
.wrap{position:relative;width:100%;max-width:800px}
.ov{position:absolute;inset:0;background:rgba(12,12,20,.88);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.ov[hidden]{display:none}
.qbox{width:100%;max-width:560px;color:#fff}
.qh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#ffb27a;margin-bottom:6px}
.qbox h3{margin:0 0 12px;font-size:20px;line-height:1.3}
.opts{display:grid;gap:8px}
.opts button{background:#2c2c36;color:#fff;text-align:left;font-size:16px;padding:12px 14px}
.opts button.ok{background:#16a34a}
.opts button.no{background:#dc2626}
.fb{margin-top:10px;font-weight:600;min-height:1.4em}
.ed{width:100%;max-width:800px;background:var(--card);border-radius:10px;padding:10px 14px;font-size:14px}
.ed summary{cursor:pointer;font-weight:600}
.ed textarea{width:100%;margin-top:10px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--mut);border-radius:8px;padding:10px}
#qs{width:auto;font-size:15px;padding:10px 18px;margin-top:8px}
#qm{margin-left:10px;color:var(--mut)}
.cn{font-weight:700;font-size:18px;width:100%;max-width:800px}.cn a{font-weight:400;font-size:13px;margin-left:10px;color:var(--mut)}
.ed button{width:auto;font-size:15px;padding:10px 16px;margin:8px 8px 0 0}
.ed input[type=text],.ed select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);margin:4px 6px 4px 0}
.ed code{word-break:break-all}
</style>
</head>
<body>
<div class="cn" id="cn"></div>
<div class="stats">
<div class="stat"><span>Balls</span><b id="bl">3</b></div>
<div class="stat"><span>Score</span><b id="sc">0</b></div>
<div class="stat"><span>Streak</span><b id="st">0</b></div>
<div class="stat"><span>Best streak</span><b id="bs">0</b></div>
</div>
<div class="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<button id="btn">Lock angle</button>
<p>The angle swings up and down: press Space (or tap the button or court) to lock it. Then press again to stop the power bar and shoot. Each shot uses a ball; answer questions to earn more.</p>

<script src="shared.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),btn=document.getElementById('btn');
const W=800,H=450,G=900,GROUND=370,HX=700,HY=200,RR=22,BR=11,VMIN=300,VMAX=950;
let px=110,angle=55,state='pick',pt=0,power=0,ball=null,rim=false,scored=false,wait=0,msg='',msgT=0,shake=0;
let score=0,streak=0,best=0,mv=null,balls=3,at=0;
try{best=+localStorage.getItem('hoopsBest')||0}catch(e){}
const $=id=>document.getElementById(id);
function ui(){$('bl').textContent=balls;$('sc').textContent=score;$('st').textContent=streak;$('bs').textContent=best}
function label(){btn.textContent={aim:'Lock angle',power:'Shoot!',fly:'…',move:'…',quiz:'Answer to earn balls',pick:'Choose a class'}[state]}
function say(t){msg=t;msgT=1.2}
function advance(){
  if(state==='aim'){state='power';pt=0}
  else if(state==='power'){
    const v=VMIN+power*(VMAX-VMIN),a=angle*Math.PI/180;
    balls--;ui();ball={x:px+16,y:300,vx:v*Math.cos(a),vy:-v*Math.sin(a)};
    rim=false;scored=false;wait=0;state='fly';
  }
  label();
}
btn.onclick=advance;
addEventListener('keydown',e=>{
  if(state==='quiz'||state==='pick')return;
  if(e.code==='Space'){e.preventDefault();advance()}
});
cv.onpointerdown=advance;
function hitPoint(cx,cy){
  const dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy),m=BR+3;
  if(d<m&&d>0){
    const nx=dx/d,ny=dy/d;ball.x=cx+nx*m;ball.y=cy+ny*m;
    const vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){ball.vx-=1.55*vn*nx;ball.vy-=1.55*vn*ny;rim=true}
  }
}
function hitRect(x1,y1,x2,y2){
  const cx=Math.max(x1,Math.min(x2,ball.x)),cy=Math.max(y1,Math.min(y2,ball.y));
  let dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy);
  if(d>=BR)return;
  if(d===0){dx=-1;dy=0;d=1;ball.x=x1}
  const nx=dx/d,ny=dy/d;ball.x=cx+nx*BR;ball.y=cy+ny*BR;
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ball.vx-=1.5*vn*nx;ball.vy-=1.5*vn*ny;rim=true}
}
function step(dt){
  const py=ball.y;
  ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  hitPoint(HX-RR,HY);hitPoint(HX+RR,HY);
  hitRect(HX+RR+2,HY-85,HX+RR+10,HY+15);
  hitRect(HX+RR+20,HY-80,HX+RR+28,GROUND);
  if(!scored&&ball.vy>0&&py<HY&&ball.y>=HY&&Math.abs(ball.x-HX)<RR-3){
    scored=true;score++;streak++;shake=0.4;
    if(streak>best){best=streak;try{localStorage.setItem('hoopsBest',best)}catch(e){}}
    say(rim?'Nice!':'Swish!');ui();wait=0.9;
  }
  if(ball.y>GROUND-BR){ball.y=GROUND-BR;ball.vy*=-0.5;ball.vx*=0.7;if(!wait)wait=0.8}
  if(ball.x>W+40||ball.x<-40){if(!wait)wait=0.3}
}
function endShot(){
  if(scored){
    let nx;do{nx=70+Math.random()*410}while(Math.abs(nx-px)<90);
    mv={from:px,to:nx,t:0};state='move';
  }else{streak=0;say('Miss');ui();next()}
  ball=null;label();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  at+=dt;if(state==='aim')angle=20+60*(1-Math.abs(((at*0.6)%2)-1));
  if(state==='power'){pt+=dt;power=1-Math.abs(((pt*0.85)%2)-1)}
  if(state==='fly'&&ball){
    for(let i=0;i<4;i++)step(dt/4);
    if(wait){wait-=dt;if(wait<=0)endShot()}
  }
  if(state==='move'){
    mv.t+=dt/0.7;const k=Math.min(1,mv.t),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    px=mv.from+(mv.to-mv.from)*e;
    if(k>=1)next();
  }
  if(msgT>0)msgT-=dt;if(shake>0)shake-=dt;
  draw();requestAnimationFrame(loop);
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#2b3a5c');g.addColorStop(1,'#d9825b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#b8733f';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#8f562b';ctx.fillRect(0,GROUND,W,6);
  // pole + backboard
  ctx.fillStyle='#555';ctx.fillRect(HX+RR+20,HY-80,8,GROUND-HY+80);
  ctx.fillStyle='#f4f4f4';ctx.fillRect(HX+RR+2,HY-85,8,100);
  ctx.fillStyle='#e8661c';ctx.fillRect(HX+RR+2,HY-20,8,6);
  // net
  const sh=shake>0?Math.sin(shake*60)*4:0;
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;
  for(let i=0;i<=6;i++){
    const t=i/6,x1=HX-RR+t*2*RR,x2=HX-RR*0.55+t*RR*1.1+sh;
    ctx.beginPath();ctx.moveTo(x1,HY);ctx.lineTo(x2,HY+40);ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(HX-RR*0.8,HY+20);ctx.lineTo(HX+RR*0.8,HY+20);ctx.stroke();
  // rim
  ctx.strokeStyle='#ff5a1f';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(HX-RR,HY);ctx.lineTo(HX+RR,HY);ctx.stroke();
  // player
  const gx=px,gy=GROUND;
  ctx.strokeStyle='#111';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx-4,gy-38);ctx.moveTo(gx+8,gy);ctx.lineTo(gx+4,gy-38);ctx.stroke();
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(gx,gy-40);ctx.lineTo(gx+2,gy-72);ctx.stroke();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(gx+3,gy-86,12,0,7);ctx.fill();
  ctx.strokeStyle='#f0c9a0';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(gx+2,gy-66);ctx.lineTo(gx+16,gy-70);ctx.stroke();
  // ball
  let b=ball||{x:px+16,y:300};
  if((state==='fly'&&!ball)||state==='quiz')b=null;
  if(b&&(state!=='move'||true)){
    const bx=state==='move'?px+16:b.x;
    ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.arc(bx,b.y,BR,0,7);ctx.fill();
    ctx.strokeStyle='#5a2a08';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-BR,b.y);ctx.lineTo(bx+BR,b.y);ctx.moveTo(bx,b.y-BR);ctx.lineTo(bx,b.y+BR);ctx.stroke();
  }
  // aim arrow
  if(state==='aim'||state==='power'){
    const a=angle*Math.PI/180,x0=px+16,y0=300,L=70;
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+Math.cos(a)*L,y0-Math.sin(a)*L);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#fff';ctx.font='600 14px system-ui';ctx.fillText(Math.round(angle)+'°',x0+Math.cos(a)*L+8,y0-Math.sin(a)*L);
  }
  // power bar
  const bx0=200,bw=400,by0=405,bh=22;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx0-4,by0-4,bw+8,bh+8);
  const pg=ctx.createLinearGradient(bx0,0,bx0+bw,0);pg.addColorStop(0,'#4ade80');pg.addColorStop(.6,'#facc15');pg.addColorStop(1,'#ef4444');
  ctx.fillStyle=pg;ctx.globalAlpha=state==='power'?1:.45;ctx.fillRect(bx0,by0,bw,bh);ctx.globalAlpha=1;
  if(state==='power'){
    const mx=bx0+power*bw;ctx.fillStyle='#fff';ctx.fillRect(mx-3,by0-8,6,bh+16);
  }
  ctx.fillStyle='#fff';ctx.font='600 12px system-ui';ctx.fillText('POWER',bx0-58,by0+16);
  // message
  if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);ctx.fillStyle='#fff';ctx.font='800 44px system-ui';ctx.textAlign='center';ctx.fillText(msg,W/2,110);ctx.textAlign='left';ctx.globalAlpha=1}
}
let cfg=null;
function next(){state=balls>0?'aim':'quiz';label();if(state==='quiz')askQ()}
function askQ(){QZ.ask(document.querySelector('.wrap'),{head:'Out of balls! Answer correctly to earn '+cfg.balls,
  onCorrect:()=>{balls+=cfg.balls;ui();state='aim';label()}})}
(async()=>{
  cfg=await QZ.load();
  if(!cfg){location.replace('index.html'+location.search);return}
  $('cn').textContent=cfg.name||'';
  balls=3;state='aim';ui();label();
})();
ui();label();requestAnimationFrame(loop);
</script>
</body>
</html>
