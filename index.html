<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Choose your class</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--card:#fff;--ac:#e8661c}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--fg:#f1efe9;--card:#232328;--ac:#ff7b36}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px;gap:14px}
#list{display:grid;gap:10px;width:100%;max-width:420px}
a{display:block;background:var(--card);color:var(--fg);text-decoration:none;font-weight:600;font-size:18px;padding:16px;border-radius:12px;border-left:6px solid var(--ac)}
</style></head><body>
<h1>Choose your class</h1><div id="list">Loading…</div>
<script src="shared.js"></script>
<script>
(async()=>{
  const c=await QZ.load();
  if(c){location.replace(c.game+'.html'+location.search);return}
  const box=document.getElementById('list');box.textContent='';
  if(!QZ.list.length){box.textContent='No classes found. Ask your teacher for your class link.';return}
  QZ.list.forEach(x=>{const a=document.createElement('a');a.href='?class='+encodeURIComponent(x.id);a.textContent=x.name||x.id;box.append(a)});
})();
</script></body></html>
